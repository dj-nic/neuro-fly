name: Idee oder nächste Aufgabe
description: Einen Adapter, eine Messung oder eine Verbesserung vorschlagen.
title: "[Idee] "
body:
  - type: textarea
    id: goal
    attributes:
      label: Ziel
      description: Welches konkrete Problem soll gelöst werden?
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Vorschlag
      description: Geplantes Verhalten, betroffene Komponenten und benötigte Hardware.
  - type: textarea
    id: validation
    attributes:
      label: Woran erkennen wir, dass es funktioniert?
      description: Einen prüfbaren Test oder eine Messung vorschlagen.
    validations:
      required: true
